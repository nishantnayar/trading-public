name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: quantis
      PGUSER: postgres
      PGPASSWORD: ci
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: quantis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quantis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups --no-group rl

      - name: Ruff
        run: uv run ruff check src tests scripts dashboard

      - name: Black
        run: uv run black --check src tests scripts dashboard

      - name: Flake8
        run: uv run flake8 src tests scripts dashboard

      - name: mypy
        run: uv run mypy src tests scripts

      - name: pytest
        run: uv run pytest

  frontend:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint

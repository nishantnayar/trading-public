# Isolated hook envs so Cursor/Git GUI commits work without uv or npm on PATH.
# Install once per clone:  uv run pre-commit install

default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^frontend/
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-symlinks
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [src, tests, scripts]
        pass_filenames: false
        additional_dependencies: []

  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend eslint
        language: python
        files: ^frontend/
        exclude: ^frontend/(node_modules|\.next)/
        pass_filenames: false
        entry: python scripts/run_frontend_lint.py

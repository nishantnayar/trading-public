[project]
name = "quantis"
version = "0.1.0"
description = "Cross-sectional US equity ML trading system (daily/weekly, long/short)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # --- data wrangling / storage / config (no version friction) ---
    "pandas>=2.1,<3",
    "numpy>=1.26,<2.1",
    "pyarrow>=15",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    "httpx>=0.27",
    "tenacity>=8",
    "loguru>=0.7",
    # Prefect 2.20's GatherTaskGroup is not compatible with AnyIO 4.14+
    # (abstract create_task). Keep 2.x on AnyIO 4.13 until Prefect 3.
    "anyio>=4.4,<4.14",
]

[dependency-groups]
# Market data sources
data = [
    "alpaca-py>=0.21",
    "yfinance>=0.2.40",
    "pandas-datareader>=0.10",
]
# Modeling + experiment tracking
ml = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "shap>=0.45",
    "mlflow>=2.14",
]
# Backtesting + analytics (numba-constrained corner, isolated on purpose)
backtest = [
    "vectorbt>=0.26",
    "quantstats>=0.0.62",
]
# Reinforcement-learning portfolio agent (optional, pulls torch)
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.2",
]
# Orchestration
orchestration = [
    "prefect>=2.19,<3",
]
# FastAPI backend for the Next.js UI
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# Streamlit smoke test (temporary)
app = [
    "streamlit>=1.36",
    # plotly 7.0 removed the `scattermapbox` trace that vectorbt still references,
    # so cap below 7 until vectorbt migrates to `scattermap`.
    "plotly>=6,<7",
    "altair>=5",
]
# Dev tooling
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "black>=26",
    "flake8>=7.3",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantis"]
